<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tepari To-Be Swimlane</title>
<style>
  body { margin: 0; padding: 20px; font-family: sans-serif; background: #fff; }
  svg text { font-family: sans-serif; }
  .t  { font-size: 14px; font-weight: 400; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a18; }
    .t  { fill: #D3D1C7; }
    .ts { fill: #888780; }
    .th { fill: #D3D1C7; }
  }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Lane backgrounds -->
<rect x="0" y="0" width="680" height="184" fill="#F1EFE8"/>
<rect x="0" y="184" width="680" height="64" fill="#E8E6DF"/>
<rect x="0" y="248" width="680" height="220" fill="#F1EFE8"/>
<rect x="0" y="468" width="680" height="280" fill="#E8E6DF"/>
<rect x="0" y="748" width="680" height="172" fill="#F1EFE8"/>

<!-- Lane labels -->
<text class="th" x="14" y="92" text-anchor="start" transform="rotate(-90,14,92)" style="font-size:11px">Customer</text>
<text class="th" x="14" y="218" text-anchor="start" transform="rotate(-90,14,218)" style="font-size:11px">System</text>
<text class="th" x="14" y="360" text-anchor="start" transform="rotate(-90,14,360)" style="font-size:11px">Main Agent</text>
<text class="th" x="14" y="610" text-anchor="start" transform="rotate(-90,14,610)" style="font-size:11px">Sales Support</text>
<text class="th" x="14" y="838" text-anchor="start" transform="rotate(-90,14,838)" style="font-size:11px">Sales</text>

<!-- Lane dividers -->
<line x1="0" y1="184" x2="680" y2="184" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="0" y1="248" x2="680" y2="248" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="0" y1="468" x2="680" y2="468" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="0" y1="748" x2="680" y2="748" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="30" y1="0" x2="30" y2="920" stroke="#B4B2A9" stroke-width="0.5"/>

<!-- NEW ROLE badge -->
<rect x="560" y="256" width="76" height="20" rx="10" fill="#1D9E75"/>
<text x="598" y="270" text-anchor="middle" style="font-size:10px;fill:#fff;font-weight:500">New role</text>

<!-- LANE 1: Customer -->
<rect x="200" y="20" width="280" height="52" rx="8" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Fills in Portal Form</text>
<text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">Name · Phone · Email · Product · Message</text>

<!-- Arrow down to System -->
<line x1="340" y1="72" x2="340" y2="192" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LANE 2: System -->
<rect x="180" y="196" width="320" height="44" rx="8" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">Zapier routes to Contact Center Inbox</text>
<text class="ts" x="340" y="230" text-anchor="middle" dominant-baseline="central">Microsoft Contact Center</text>

<!-- Arrow down to Main Agent -->
<line x1="340" y1="240" x2="340" y2="256" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LANE 3: Main Agent - Teal -->
<rect x="40" y="260" width="160" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="120" y="278" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Receives email</text>
<text class="ts" x="120" y="294" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">in inbox</text>

<line x1="200" y1="282" x2="224" y2="282" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="224" y="260" width="150" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="299" y="278" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Search CRM</text>
<text class="ts" x="299" y="294" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">by email + phone</text>

<line x1="374" y1="282" x2="394" y2="282" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decision diamond: Account? -->
<polygon points="442,260 490,282 442,304 394,282" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="442" y="282" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Account?</text>

<!-- No: create account -->
<line x1="442" y1="304" x2="442" y2="336" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="452" y="322" style="fill:#5F5E5A">No</text>
<rect x="378" y="336" width="128" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="442" y="354" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">Create Account</text>
<text class="ts" x="442" y="370" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Farm/Property name</text>

<!-- Yes: bypass -->
<path d="M490 282 L530 282 L530 390 L510 390" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="512" y="276" style="fill:#5F5E5A">Yes</text>

<line x1="506" y1="358" x2="530" y2="358" stroke="#888780" stroke-width="1" fill="none"/>
<line x1="530" y1="358" x2="530" y2="390" stroke="#888780" stroke-width="1" fill="none"/>

<!-- Create/Link Contact -->
<rect x="378" y="374" width="160" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="458" y="392" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Create/Link Contact</text>
<text class="ts" x="458" y="408" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">to Account</text>

<line x1="458" y1="418" x2="458" y2="436" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Create Activity -->
<rect x="340" y="436" width="196" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="438" y="454" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Create Activity</text>
<text class="ts" x="438" y="470" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">Product · Message · Date · Source</text>

<line x1="438" y1="480" x2="438" y2="488" stroke="#888780" stroke-width="1.5"/>
<line x1="438" y1="488" x2="340" y2="488" stroke="#888780" stroke-width="1.5"/>
<line x1="340" y1="488" x2="340" y2="496" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LANE 4: Sales Support - Purple -->
<rect x="40" y="476" width="160" height="44" rx="8" fill="#CEC BF6" stroke="#534AB7" stroke-width="0.5"/>
<rect x="40" y="476" width="160" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="120" y="494" text-anchor="middle" dominant-baseline="central" style="fill:#26215C">Receives handoff</text>
<text class="ts" x="120" y="510" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">Account+Contact+Activity</text>

<line x1="200" y1="498" x2="224" y2="498" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="224" y="476" width="140" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="294" y="494" text-anchor="middle" dominant-baseline="central" style="fill:#26215C">Assess intent</text>
<text class="ts" x="294" y="510" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">Hot / Warm / Cold</text>

<line x1="364" y1="498" x2="388" y2="498" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="388" y="476" width="120" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="448" y="494" text-anchor="middle" dominant-baseline="central" style="fill:#26215C">Create Lead</text>
<text class="ts" x="448" y="510" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">in CRM</text>

<line x1="448" y1="520" x2="448" y2="544" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decision diamond: High value? -->
<polygon points="448,544 504,566 448,588 392,566" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="448" y="566" text-anchor="middle" dominant-baseline="central" style="fill:#3C3489">High value?</text>

<!-- Low value branch -->
<path d="M392 566 L280 566" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="558" text-anchor="middle" style="fill:#5F5E5A">No</text>
<rect x="80" y="580" width="200" height="52" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="180" y="598" text-anchor="middle" dominant-baseline="central" style="fill:#4A1B0C">Full sales process</text>
<text class="ts" x="180" y="616" text-anchor="middle" dominant-baseline="central" style="fill:#712B13">Lead→Opp→Quote→Order→Invoice</text>

<!-- High value branch -->
<line x1="504" y1="566" x2="556" y2="566" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="532" y="558" style="fill:#5F5E5A">Yes</text>
<rect x="556" y="544" width="100" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="606" y="562" text-anchor="middle" dominant-baseline="central" style="fill:#085041">Assign Lead</text>
<text class="ts" x="606" y="578" text-anchor="middle" dominant-baseline="central" style="fill:#0F6E56">by region</text>

<line x1="606" y1="588" x2="606" y2="612" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="546" y="612" width="120" height="44" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="606" y="630" text-anchor="middle" dominant-baseline="central" style="fill:#412402">Set 24hr task</text>
<text class="ts" x="606" y="646" text-anchor="middle" dominant-baseline="central" style="fill:#633806">Monitor response</text>

<line x1="606" y1="656" x2="606" y2="756" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LANE 5: Sales - Blue -->
<rect x="506" y="760" width="140" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="576" y="778" text-anchor="middle" dominant-baseline="central" style="fill:#042C53">Receives Lead</text>
<text class="ts" x="576" y="794" text-anchor="middle" dominant-baseline="central" style="fill:#0C447C">full context in CRM</text>

<line x1="576" y1="804" x2="576" y2="828" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="460" y="828" width="232" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="576" y="848" text-anchor="middle" dominant-baseline="central" style="fill:#042C53">Customer engagement</text>
<text class="ts" x="576" y="866" text-anchor="middle" dominant-baseline="central" style="fill:#0C447C">Opp→Quote→Order→Invoice</text>

<!-- Bottom tagline -->
<text class="ts" x="340" y="910" text-anchor="middle" style="fill:#888780">One entry point · Three clear layers · Zero dirty data</text>
</svg>
</body>
</html>
